name: Atualiza gráfico de contribuições

"on":
  schedule:
    - cron: "17 9 * * *" # ~06:17 em São Paulo, todo dia
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - run: python scripts/fetch_contributions.py ${{ github.repository_owner }}
      - run: python scripts/render_heatmap_svg.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza gráfico de contribuições [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
